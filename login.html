<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন করুন - AmmazanBD ই-বুক লাইব্রেরি</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f3f4f6;
        }
        .login-card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <!-- Login Container Card -->
    <div class="bg-white p-8 md:p-10 rounded-3xl login-card w-full max-w-md border border-slate-200">
        
        <!-- Header: Logo & Title -->
        <div class="text-center mb-8 space-y-2">
            <div class="inline-block p-4 bg-teal-50 rounded-full border border-teal-100 mb-3">
                <i class="fa-solid fa-book-open text-4xl text-teal-600"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800">AmmazanBD</h1>
            <p class="text-slate-500 font-medium">আপনার লাইব্রেরিতে লগইন করুন</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            
            <!-- User ID Input -->
            <div class="space-y-1.5">
                <label for="userId" class="block text-sm font-semibold text-slate-700 flex items-center">
                    <i class="fa-solid fa-user-tag text-teal-500 mr-2"></i> ইউজার আইডি (Email/User)
                </label>
                <input type="text" id="userId" placeholder="যেমন: user_1234@ammazan.com" required
                    class="w-full px-5 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none focus:border-teal-500 transition duration-150">
                <p class="text-xs text-slate-400">অর্ডার কনফার্মেশনের পর আপনার মেসেজে আইডিটি পাবেন।</p>
            </div>

            <!-- Password Input -->
            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-semibold text-slate-700 flex items-center">
                    <i class="fa-solid fa-key text-teal-500 mr-2"></i> পাসওয়ার্ড (Password)
                </label>
                <div class="relative">
                    <input type="password" id="password" placeholder="যেমন: BD#123456" required
                        class="w-full px-5 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none focus:border-teal-500 transition duration-150 pr-12">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-teal-600">
                        <i id="passwordIcon" class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-400">অর্ডার কনফার্মেশনের পর আপনার মেসেজে পাসওয়ার্ডটি পাবেন।</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-md transition duration-200 flex justify-center items-center">
                <i class="fa-solid fa-door-open mr-2"></i> লগইন করুন
            </button>
        </form>

        <!-- Loading State Overlay (Hidden by Default) -->
        <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-50 flex items-center justify-center hidden">
            <div class="text-center space-y-4">
                <i class="fa-solid fa-spinner fa-spin text-5xl text-teal-600"></i>
                <p class="text-lg font-bold text-slate-800">অ্যাকাউন্ট যাচাই করা হচ্ছে...</p>
                <p class="text-sm text-slate-500">একটু অপেক্ষা করুন।</p>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed top-5 right-5 bg-rose-600 text-white px-5 py-3 rounded-lg shadow-xl hidden transition duration-300 flex items-center space-x-2 z-50">
            <i class="fa-solid fa-circle-xmark text-rose-200"></i>
            <span id="toastMessage">ভুল আইডি বা পাসওয়ার্ড!</span>
        </div>

    </div>

    <!-- JavaScript Login Logic -->
    <script>
        // === JSONBin Configuration (REPLACE THESE KEYS WITH YOURS) ===
        const BIN_ID = '6a789f84da38895dfecd7821'; 
        const MASTER_KEY = '$2a$10$csUSHhdAFTpzTd.b7q5S6.QwoMIKw5LJ.BLuPWdVGl0qER0iTyAZu'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        // Function to toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            }
        }

        // Login Form Submit Handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const userIdInput = document.getElementById('userId').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            // 1. Show Loading State
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> লোডিং...`;
            loadingOverlay.classList.remove('hidden');

            try {
                // 2. Fetch Order Data from Cloud
                const res = await fetch(API_URL, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });

                if (res.ok) {
                    const data = await res.json();
                    const orders = Array.isArray(data.record) ? data.record : [];

                    // 3. Verify Account Credentials
                    // Check if there is an order where user and pass match the input
                    const validOrder = orders.find(order => order.user === userIdInput && order.pass === passwordInput);

                    if (validOrder) {
                        // Success! Save session and redirect
                        // This simple session storage only lasts until the browser is closed.
                        sessionStorage.setItem('ammazan_user', userIdInput);
                        loadingOverlay.innerHTML = `
                            <div class="text-center space-y-4">
                                <i class="fa-solid fa-circle-check text-5xl text-emerald-500"></i>
                                <p class="text-lg font-bold text-slate-800">সফলভাবে লগইন হয়েছে!</p>
                                <p class="text-sm text-slate-500">আপনাকে লাইব্রেরিতে নিয়ে যাওয়া হচ্ছে...</p>
                            </div>
                        `;
                        // Redirect to your main library page after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html'; 
                        }, 2000);

                    } else {
                        // Failure: Incorrect user or pass
                        showToast('ভুল ইউজার আইডি বা পাসওয়ার্ড। দয়া করে আবার চেষ্টা করুন।');
                    }
                } else {
                    // API Call Failed (Network issue or wrong keys)
                    showToast('ক্লাউড কানেকশনে ত্রুটি হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।');
                }
            } catch (err) {
                // Network error
                console.error(err);
                showToast('একটি অভ্যন্তরীণ ত্রুটি হয়েছে। পরে আবার চেষ্টা করুন।');
            } finally {
                // 4. Hide Loading State & Restore Button
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-door-open mr-2"></i> লগইন করুন`;
                loadingOverlay.classList.add('hidden');
            }
        });

        // Helper: Show Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('hidden');
            // Play a gentle subtle shake animation if available in your css, but hidden works for now
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 5000); // 5 seconds
        }
    </script>
</body>
</html>
